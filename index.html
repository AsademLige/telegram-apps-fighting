<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ОХОТА</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent
    }

    html,
    body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      height: 100svh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      overscroll-behavior: none;
      background: #10251d;
      color: #f3e7bd;
      font-family: Arial, Helvetica, sans-serif;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      position: fixed;
      inset: 0;
    }

    #game {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
      background: #10251d;
      background-image: radial-gradient(#31533f 1px, transparent 1px);
      background-size: 5px 5px;
    }

    #status {
      height: 24dvh;
      min-height: 145px;
      padding: 16px 18px 8px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      z-index: 10;
    }

    #input-zone {
      height: 76dvh;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }

    #star-container {
      width: min(84vw, 67dvh);
      height: min(84vw, 67dvh);
      position: relative;
      filter: none;
      touch-action: none;
    }

    #enemy-section {
      display: flex;
      flex-direction: column;
      gap: 7px
    }

    #enemy-top {
      display: flex;
      align-items: center;
      justify-content: space-between
    }

    #enemy-label {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 3px;
      color: #f3e7bd;
      text-transform: uppercase
    }

    #enemy-core {
      font-size: 10px;
      color: #e95732;
      letter-spacing: 2px;
      font-weight: 700
    }

    #enemy-hp-bar {
      height: 10px;
      background: #17221c;
      border-radius: 0;
      overflow: hidden;
      border: 2px solid #f3e7bd;
      box-shadow: 3px 3px 0 #07120d
    }

    #enemy-hp-fill {
      height: 100%;
      width: 100%;
      background: #e95732;
      transition: width .22s steps(8, end);
      box-shadow: none
    }

    #enemy-visual {
      display: none
    }

    #combo {
      font-size: 13px;
      letter-spacing: 3px;
      color: #d6c997;
      min-height: 18px;
      text-align: center;
      font-weight: 800
    }

    #combo b {
      color: #63b85b
    }

    #hearts-section {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: center;
      width: 100%;
      margin: 10px auto;
    }

    .heart {
      width: 50px;
      height: 50px;
      transition: transform .2s, opacity .2s;
      filter: drop-shadow(3px 3px 0px rgba(0, 0, 0, 0.4));
    }

    .heart.lost {
      opacity: .15
    }

    .heart.breaking {
      animation: heartBreak .35s ease-out
    }

    @keyframes heartBreak {
      0% {
        transform: scale(1)
      }

      40% {
        transform: scale(1.5) rotate(-8deg)
      }

      100% {
        transform: scale(1)
      }
    }

    #star-svg {
      width: 100%;
      height: 100%;
      overflow: visible
    }

    .ray-base {
      fill: #173b2b;
      stroke: #f3e7bd;
      stroke-width: 1.5;
      transition: fill .10s, opacity .10s
    }

    .ray-base.cue-active {
      fill: var(--c-fill);
      opacity: var(--c-opacity);
      filter: none;
      transition: none
    }

    .ray-hl {
      opacity: 0;
      pointer-events: none
    }

    .ray-hl.hl-on {
      opacity: 1
    }

    .ray-tip {
      fill: #30384b;
      transition: fill .12s, filter .12s
    }

    .ray-base.cue-active+.ray-hl+.ray-tip {
      fill: var(--c-fill);
      filter: drop-shadow(0 0 7px var(--c-glow))
    }

    #center-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: #e7d79e;
      border: 4px solid #10251d;
      outline: 3px solid #f3e7bd;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
      transition: .10s;
      box-shadow: 5px 5px 0 #07120d
    }

    #center-btn::before {
      content: "";
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #e95732;
      box-shadow: none;
      transition: .10s
    }

    #center-btn.cue-active {
      border-color: #10251d;
      outline-color: var(--c-fill);
      box-shadow: 5px 5px 0 #07120d
    }

    #center-btn.cue-active::before {
      background: var(--c-fill);
      box-shadow: none
    }

    #center-btn.tap-ping {
      animation: tapPing .25s ease-out
    }

    @keyframes tapPing {
      0% {
        transform: translate(-50%, -50%) scale(1)
      }

      50% {
        transform: translate(-50%, -50%) scale(.8)
      }

      100% {
        transform: translate(-50%, -50%) scale(1)
      }
    }

    #timing-hint {
      position: absolute;
      bottom: 5%;
      left: 50%;
      transform: translateX(-50%);
      font-size: 10px;
      letter-spacing: 2px;
      color: #9eaf86;
      text-transform: uppercase;
      pointer-events: none;
      transition: opacity .2s;
      font-weight: 800
    }

    #notification {
      position: absolute;
      top: 30%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 29px;
      font-weight: 900;
      letter-spacing: 3px;
      text-transform: uppercase;
      opacity: 0;
      pointer-events: none;
      text-shadow: 3px 3px 0 #07120d;
      white-space: nowrap;
      z-index: 30
    }

    #notification.show {
      animation: notifyPulse .72s ease-out
    }

    @keyframes notifyPulse {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(.55)
      }

      18% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.12)
      }

      75% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1)
      }

      100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(.92)
      }
    }

    #flash-overlay {
      position: fixed;
      inset: 0;
      background: #63b85b;
      opacity: 0;
      pointer-events: none;
      z-index: 100
    }

    #flash-overlay.flash {
      animation: flashEffect .25s ease-out
    }

    @keyframes flashEffect {
      0% {
        opacity: .42
      }

      100% {
        opacity: 0
      }
    }

    #game.shake {
      animation: shakeEffect .24s ease-out
    }

    @keyframes shakeEffect {

      0%,
      100% {
        transform: translateX(0)
      }

      25% {
        transform: translateX(-7px)
      }

      50% {
        transform: translateX(7px)
      }

      75% {
        transform: translateX(-4px)
      }
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: #10251d;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s
    }

    .overlay.show {
      opacity: 1;
      pointer-events: all
    }

    .overlay h1 {
      font-size: 42px;
      letter-spacing: 7px;
      margin-bottom: 20px;
      text-transform: uppercase
    }

    #game-over h1 {
      color: #e95732;
      text-shadow: 4px 4px 0 #07120d
    }

    #victory h1 {
      color: #63b85b;
      text-shadow: 4px 4px 0 #07120d
    }

    .result {
      color: #7e879f;
      font-size: 12px;
      letter-spacing: 2px;
      line-height: 2;
      text-align: center;
      margin-bottom: 28px
    }

    .overlay button {
      padding: 15px 34px;
      font-size: 13px;
      letter-spacing: 3px;
      text-transform: uppercase;
      background: #e7d79e;
      border: 3px solid #f3e7bd;
      color: #10251d;
      border-radius: 0;
      box-shadow: 5px 5px 0 #07120d;
      font-weight: 900
    }

    .overlay button:active {
      background: #fff;
      color: #000;
      border-color: #fff
    }

    /* ===== SLIDER GAME MODE ===== */
    #slider-monster {
      position: absolute;
      left: 50%;
      top: 10%;
      width: min(58vw, 440px);
      height: min(58vw, 440px);
      transform: translate(-50%, -50%);
      object-fit: contain;
      pointer-events: none;
      opacity: 0.7;
      z-index: 1;
    }

    #slider-monster.hit {
      animation: monsterHit .24s ease-out;
    }

    @keyframes monsterHit {
      0% {
        transform: translate(-50%, -50%) scale(1);
        filter: brightness(1) drop-shadow(31px 10px 0px rgba(255, 255, 255, 0.25));
      }

      25% {
        transform: translate(-50%, -50%) scale(.96) translateX(-5px);
        filter: brightness(1.7) drop-shadow(12px 0px 0px rgba(255, 255, 255, 0.25));
      }

      50% {
        transform: translate(-50%, -50%) scale(1.03) translateX(5px);
        filter: brightness(1.25) drop-shadow(12px 0px 0px rgba(255, 255, 255, 0.25));
      }

      75% {
        transform: translate(-50%, -50%) scale(.99) translateX(-2px);
      }

      100% {
        transform: translate(-50%, -50%) scale(1);
      }
    }

    #slider-game {
      width: min(92vw, 760px);
      display: none;
      flex-direction: column;
      gap: 14px;
      padding: 0 6px;
      position: relative;
      z-index: 2;
    }

    #slider-game.visible {
      display: flex;
    }

    #slider-title {
      text-align: center;
      font-size: 11px;
      letter-spacing: 3px;
      font-weight: 900;
      color: #d6c997;
    }

    #slider-track {
      position: relative;
      width: 100%;
      height: 54px;
      background: #17221c;
      border: 3px solid #f3e7bd;
      box-shadow: 5px 5px 0 #07120d;
      touch-action: none;
      cursor: ew-resize;
      overflow: hidden;
    }

    #slider-track::before {
      content: "";
      position: absolute;
      inset: 9px 0;
      background: linear-gradient(90deg, #d4a72c 0%, #e5c84c 14%, #73b957 50%, #e5c84c 86%, #d4a72c 100%);
      opacity: .13;
    }

    .slider-zone {
      position: absolute;
      top: 8px;
      height: 32px;
      border: 2px solid rgba(243, 231, 189, .9);
      background: linear-gradient(90deg,
          #d7a52d 0%,
          #e6c448 28%,
          #98c94e 43%,
          #54b957 50%,
          #98c94e 57%,
          #e6c448 72%,
          #d7a52d 100%);
      box-shadow: inset 0 0 0 1px rgba(7, 18, 13, .35);
      transition: opacity .12s, filter .12s, transform .12s;
      pointer-events: none;
    }

    .slider-zone.hit {
      opacity: .0;
      filter: grayscale(1);
    }

    .slider-zone .zone-green {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 40%;
      width: 20%;
      background: #54b957;
      pointer-events: none;
    }

    #slider-knob {
      position: absolute;
      top: 3px;
      width: 15px;
      height: 48px;
      transform: translateX(-50%);
      background: #f3e7bd;
      border: 3px solid #10251d;
      box-shadow: 3px 3px 0 #07120d;
      z-index: 10;
      pointer-events: none;
      transition: none;
      /* transition: left .035s linear; */
    }

    #slider-knob::after {
      content: "";
      position: absolute;
      left: 2px;
      right: 2px;
      top: 7px;
      bottom: 7px;
      background: #e95732;
    }

    #slider-timer {
      position: relative;
      height: 12px;
      border: 2px solid #f3e7bd;
      background: #17221c;
      box-shadow: 3px 3px 0 #07120d;
      overflow: hidden;
    }

    #slider-timer-fill {
      height: 100%;
      width: 100%;
      transform-origin: left center;
      background: #63b85b;
      transition: width .05s linear, background .12s;
    }

    #slider-timer-fill.warn {
      background: #e95732;
    }

    #slider-status {
      min-height: 18px;
      text-align: center;
      color: #9eaf86;
      font-size: 10px;
      letter-spacing: 2px;
      font-weight: 800;
    }

    #slider-game.flash-hit #slider-track {
      animation: sliderHit .16s ease-out;
    }

    @keyframes sliderHit {
      50% {
        transform: scaleY(.92);
      }
    }

    @media (max-width: 520px) {
      #slider-game {
        width: 94vw;
      }

      #slider-track {
        height: 48px;
      }

      .slider-zone {
        top: 7px;
        height: 28px;
      }

      #slider-knob {
        height: 42px;
      }
    }
  </style>
</head>

<body>
  <div id="game">
    <div id="status">
      <div id="enemy-section">
        <div id="enemy-top">
          <div id="enemy-label"></div>
          <div id="enemy-core">Жив</div>

        <div id="enemy-visual">
          <div id="enemy-orb"></div>
        </div>
        <div id="enemy-hp-bar">
          <div id="enemy-hp-fill"></div>

    <div id="input-zone">

      <img id="slider-monster" alt="" />

        <div id="slider-title">MOVE THE RUNNER • HIT EVERY ZONE</div>
        <div id="slider-track">
          <div id="slider-knob"></div>
        </div>
        <div id="slider-timer">
          <div id="slider-timer-fill"></div>
        </div>
        <div id="slider-status" style="display: none;"></div>

            </svg></div>
          <div class="heart" data-heart="2"><svg viewBox="0 0 24 24" fill="#ff4466">
              <path

            </svg></div>
        </div>
      </div>
      <div id="timing-hint">SWIPE OUT • TAP CORE</div>
    </div>

    <div id="notification"></div>
    <div id="flash-overlay"></div>

    <div id="battle-start" class="overlay show">
      <h1>ОХОТА</h1>
      <div class="result">ГОТОВ?<br>НАЖМИ ЧТОБЫ НАЧАТЬ</div>
      <button id="start-battle-btn">В БОЙ!</button>
    </div>
    <div id="game-over" class="overlay">
      <h1>ПОГИБ</h1>
      <div class="result" id="gameover-result"></div><button id="restart-btn">Больно...</button>
    </div>
    <div id="victory" class="overlay">
      <h1>ПОБЕДА!</h1>
      <div class="result" id="victory-result"></div><button id="next-btn">Забрать добычу</button>
    </div>
  </div>

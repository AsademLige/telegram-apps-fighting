<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ОХОТА</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent
    }

    html,
    body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      height: 100svh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      overscroll-behavior: none;
      background: #10251d;
      color: #f3e7bd;
      font-family: Arial, Helvetica, sans-serif;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      position: fixed;
      inset: 0;
    }

    #game {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
      background: #10251d;
      background-image: radial-gradient(#31533f 1px, transparent 1px);
      background-size: 5px 5px;
    }

    #status {
      height: 24dvh;
      min-height: 145px;
      padding: 16px 18px 8px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      z-index: 10;
    }

    #input-zone {
      height: 76dvh;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }

    #star-container {
      width: min(84vw, 67dvh);
      height: min(84vw, 67dvh);
      position: relative;
      filter: none;
      touch-action: none;
    }

    #enemy-section {
      display: flex;
      flex-direction: column;
      gap: 7px
    }

    #enemy-top {
      display: flex;
      align-items: center;
      justify-content: space-between
    }

    #enemy-label {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 3px;
      color: #f3e7bd;
      text-transform: uppercase
    }

    #enemy-core {
      font-size: 10px;
      color: #e95732;
      letter-spacing: 2px;
      font-weight: 700
    }

    #enemy-hp-bar {
      height: 10px;
      background: #17221c;
      border-radius: 0;
      overflow: hidden;
      border: 2px solid #f3e7bd;
      box-shadow: 3px 3px 0 #07120d
    }

    #enemy-hp-fill {
      height: 100%;
      width: 100%;
      background: #e95732;
      transition: width .22s steps(8, end);
      box-shadow: none
    }

    #enemy-visual {
      display: none
    }

    #combo {
      font-size: 13px;
      letter-spacing: 3px;
      color: #d6c997;
      min-height: 18px;
      text-align: center;
      font-weight: 800
    }

    #combo b {
      color: #63b85b
    }

    #hearts-section {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: center;
      width: 100%;
      margin: 10px auto;
    }

    .heart {
      width: 50px;
      height: 50px;
      transition: transform .2s, opacity .2s;
      filter: drop-shadow(3px 3px 0px rgba(0, 0, 0, 0.4));
    }

    .heart.lost {
      opacity: .15
    }

    .heart.breaking {
      animation: heartBreak .35s ease-out
    }

    @keyframes heartBreak {
      0% {
        transform: scale(1)
      }

      40% {
        transform: scale(1.5) rotate(-8deg)
      }

      100% {
        transform: scale(1)
      }
    }

    #star-svg {
      width: 100%;
      height: 100%;
      overflow: visible
    }

    .ray-base {
      fill: #173b2b;
      stroke: #f3e7bd;
      stroke-width: 1.5;
      transition: fill .10s, opacity .10s
    }

    .ray-base.cue-active {
      fill: var(--c-fill);
      opacity: var(--c-opacity);
      filter: none;
      transition: none
    }

    .ray-hl {
      opacity: 0;
      pointer-events: none
    }

    .ray-hl.hl-on {
      opacity: 1
    }

    .ray-tip {
      fill: #30384b;
      transition: fill .12s, filter .12s
    }

    .ray-base.cue-active+.ray-hl+.ray-tip {
      fill: var(--c-fill);
      filter: drop-shadow(0 0 7px var(--c-glow))
    }

    #center-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: #e7d79e;
      border: 4px solid #10251d;
      outline: 3px solid #f3e7bd;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
      transition: .10s;
      box-shadow: 5px 5px 0 #07120d
    }

    #center-btn::before {
      content: "";
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #e95732;
      box-shadow: none;
      transition: .10s
    }

    #center-btn.cue-active {
      border-color: #10251d;
      outline-color: var(--c-fill);
      box-shadow: 5px 5px 0 #07120d
    }

    #center-btn.cue-active::before {
      background: var(--c-fill);
      box-shadow: none
    }

    #center-btn.tap-ping {
      animation: tapPing .25s ease-out
    }

    @keyframes tapPing {
      0% {
        transform: translate(-50%, -50%) scale(1)
      }

      50% {
        transform: translate(-50%, -50%) scale(.8)
      }

      100% {
        transform: translate(-50%, -50%) scale(1)
      }
    }

    #timing-hint {
      position: absolute;
      bottom: 5%;
      left: 50%;
      transform: translateX(-50%);
      font-size: 10px;
      letter-spacing: 2px;
      color: #9eaf86;
      text-transform: uppercase;
      pointer-events: none;
      transition: opacity .2s;
      font-weight: 800
    }

    #notification {
      position: absolute;
      top: 30%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 29px;
      font-weight: 900;
      letter-spacing: 3px;
      text-transform: uppercase;
      opacity: 0;
      pointer-events: none;
      text-shadow: 3px 3px 0 #07120d;
      white-space: nowrap;
      z-index: 30
    }

    #notification.show {
      animation: notifyPulse .72s ease-out
    }

    @keyframes notifyPulse {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(.55)
      }

      18% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.12)
      }

      75% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1)
      }

      100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(.92)
      }
    }

    #flash-overlay {
      position: fixed;
      inset: 0;
      background: #63b85b;
      opacity: 0;
      pointer-events: none;
      z-index: 100
    }

    #flash-overlay.flash {
      animation: flashEffect .25s ease-out
    }

    @keyframes flashEffect {
      0% {
        opacity: .42
      }

      100% {
        opacity: 0
      }
    }

    #game.shake {
      animation: shakeEffect .24s ease-out
    }

    @keyframes shakeEffect {

      0%,
      100% {
        transform: translateX(0)
      }

      25% {
        transform: translateX(-7px)
      }

      50% {
        transform: translateX(7px)
      }

      75% {
        transform: translateX(-4px)
      }
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: #10251d;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s
    }

    .overlay.show {
      opacity: 1;
      pointer-events: all
    }

    .overlay h1 {
      font-size: 42px;
      letter-spacing: 7px;
      margin-bottom: 20px;
      text-transform: uppercase
    }

    #game-over h1 {
      color: #e95732;
      text-shadow: 4px 4px 0 #07120d
    }

    #victory h1 {
      color: #63b85b;
      text-shadow: 4px 4px 0 #07120d
    }

    .result {
      color: #7e879f;
      font-size: 12px;
      letter-spacing: 2px;
      line-height: 2;
      text-align: center;
      margin-bottom: 28px
    }

    .overlay button {
      padding: 15px 34px;
      font-size: 13px;
      letter-spacing: 3px;
      text-transform: uppercase;
      background: #e7d79e;
      border: 3px solid #f3e7bd;
      color: #10251d;
      border-radius: 0;
      box-shadow: 5px 5px 0 #07120d;
      font-weight: 900
    }

    .overlay button:active {
      background: #fff;
      color: #000;
      border-color: #fff
    }

    /* ===== SLIDER GAME MODE ===== */
    #slider-monster {
      position: absolute;
      left: 50%;
      top: 10%;
      width: min(58vw, 440px);
      height: min(58vw, 440px);
      transform: translate(-50%, -50%);
      object-fit: contain;
      pointer-events: none;
      opacity: 0.7;
      z-index: 1;
    }

    #slider-monster.hit {
      animation: monsterHit .24s ease-out;
    }

    @keyframes monsterHit {
      0% {
        transform: translate(-50%, -50%) scale(1);
        filter: brightness(1) drop-shadow(31px 10px 0px rgba(255, 255, 255, 0.25));
      }

      25% {
        transform: translate(-50%, -50%) scale(.96) translateX(-5px);
        filter: brightness(1.7) drop-shadow(12px 0px 0px rgba(255, 255, 255, 0.25));
      }

      50% {
        transform: translate(-50%, -50%) scale(1.03) translateX(5px);
        filter: brightness(1.25) drop-shadow(12px 0px 0px rgba(255, 255, 255, 0.25));
      }

      75% {
        transform: translate(-50%, -50%) scale(.99) translateX(-2px);
      }

      100% {
        transform: translate(-50%, -50%) scale(1);
      }
    }

    #slider-game {
      width: min(92vw, 760px);
      display: none;
      flex-direction: column;
      gap: 14px;
      padding: 0 6px;
      position: relative;
      z-index: 2;
    }

    #slider-game.visible {
      display: flex;
    }

    #slider-title {
      text-align: center;
      font-size: 11px;
      letter-spacing: 3px;
      font-weight: 900;
      color: #d6c997;
    }

    #slider-track {
      position: relative;
      width: 100%;
      height: 54px;
      background: #17221c;
      border: 3px solid #f3e7bd;
      box-shadow: 5px 5px 0 #07120d;
      touch-action: none;
      cursor: ew-resize;
      overflow: hidden;
    }

    #slider-track::before {
      content: "";
      position: absolute;
      inset: 9px 0;
      background: linear-gradient(90deg, #d4a72c 0%, #e5c84c 14%, #73b957 50%, #e5c84c 86%, #d4a72c 100%);
      opacity: .13;
    }

    .slider-zone {
      position: absolute;
      top: 8px;
      height: 32px;
      border: 2px solid rgba(243, 231, 189, .9);
      background: linear-gradient(90deg,
          #d7a52d 0%,
          #e6c448 28%,
          #98c94e 43%,
          #54b957 50%,
          #98c94e 57%,
          #e6c448 72%,
          #d7a52d 100%);
      box-shadow: inset 0 0 0 1px rgba(7, 18, 13, .35);
      transition: opacity .12s, filter .12s, transform .12s;
      pointer-events: none;
    }

    .slider-zone.hit {
      opacity: .0;
      filter: grayscale(1);
    }

    .slider-zone.critical {
      background: #ffb000;
      /* border-color: #ffd166; */
    }

    .slider-zone.critical::after {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff7df;
      pointer-events: none;
    }

    .slider-zone.critical.hit {
      opacity: 0;
      animation: none;
      transform: scaleY(.75);
      filter: brightness(1.8);
    }

    @keyframes criticalZonePulse {
      50% {
        filter: brightness(1.18);
        box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .3), 0 0 22px rgba(255, 122, 0, 1);
      }
    }

    .slider-zone .zone-green {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 40%;
      width: 20%;
      background: #54b957;
      pointer-events: none;
    }

    #slider-knob {
      position: absolute;
      top: 3px;
      width: 15px;
      height: 48px;
      transform: translateX(-50%);
      background: #f3e7bd;
      border: 3px solid #10251d;
      box-shadow: 3px 3px 0 #07120d;
      z-index: 10;
      pointer-events: none;
      transition: none;
      /* transition: left .035s linear; */
    }

    #slider-knob::after {
      content: "";
      position: absolute;
      left: 2px;
      right: 2px;
      top: 7px;
      bottom: 7px;
      background: #e95732;
    }

    #slider-timer {
      position: relative;
      height: 12px;
      border: 2px solid #f3e7bd;
      background: #17221c;
      box-shadow: 3px 3px 0 #07120d;
      overflow: hidden;
    }

    #slider-timer-fill {
      height: 100%;
      width: 100%;
      transform-origin: left center;
      background: #63b85b;
      transition: width .05s linear, background .12s;
    }

    #slider-timer-fill.warn {
      background: #e95732;
    }

    #slider-status {
      min-height: 18px;
      text-align: center;
      color: #9eaf86;
      font-size: 10px;
      letter-spacing: 2px;
      font-weight: 800;
    }

    #slider-game.flash-hit #slider-track {
      animation: sliderHit .16s ease-out;
    }

    @keyframes sliderHit {
      50% {
        transform: scaleY(.92);
      }
    }

    @media (max-width: 520px) {
      #slider-game {
        width: 94vw;
      }

      #slider-track {
        height: 48px;
      }

      .slider-zone {
        top: 7px;
        height: 28px;
      }

      #slider-knob {
        height: 42px;
      }
    }
  </style>
</head>

<body>
  <div id="game">
    <div id="status">
      <div id="enemy-section">
        <div id="enemy-top">
          <div id="enemy-label"></div>
          <div id="enemy-core">Жив</div>
        </div>
        <div id="enemy-visual">
          <div id="enemy-orb"></div>
        </div>
        <div id="enemy-hp-bar">
          <div id="enemy-hp-fill"></div>
        </div>
        <div id="combo">COMBO <b id="combo-value">×0</b></div>
      </div>
    </div>

    <div id="input-zone">
      <div id="star-container">
        <svg id="star-svg" viewBox="0 0 200 200"></svg>
        <div id="center-btn"></div>
      </div>
      <img id="slider-monster" alt="" />
      <div id="slider-game">
        <div id="slider-title">MOVE THE RUNNER • HIT EVERY ZONE</div>
        <div id="slider-track">
          <div id="slider-knob"></div>
        </div>
        <div id="slider-timer">
          <div id="slider-timer-fill"></div>
        </div>
        <div id="slider-status" style="display: none;"></div>
        <div id="hearts-section">
          <div class="heart" data-heart="0"><svg viewBox="0 0 24 24" fill="#ff4466">
              <path
                d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
            </svg></div>
          <div class="heart" data-heart="1"><svg viewBox="0 0 24 24" fill="#ff4466">
              <path
                d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
            </svg></div>
          <div class="heart" data-heart="2"><svg viewBox="0 0 24 24" fill="#ff4466">
              <path
                d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
            </svg></div>
        </div>
      </div>
      <div id="timing-hint">SWIPE OUT • TAP CORE</div>
    </div>

    <div id="notification"></div>
    <div id="flash-overlay"></div>

    <div id="no-battle" class="overlay">
      <h1>НЕТ БИТВЫ</h1>
      <div class="result">СЕЙЧАС НЕТ АКТИВНОЙ БИТВЫ<br>ЗАКРОЙТЕ ИГРУ И ПОПРОБУЙТЕ ПОЗЖЕ</div>
    </div>

    <div id="battle-start" class="overlay show">
      <h1>ОХОТА</h1>
      <div class="result">ГОТОВ?<br>НАЖМИ ЧТОБЫ НАЧАТЬ</div>
      <button id="start-battle-btn">В БОЙ!</button>
    </div>
    <div id="game-over" class="overlay">
      <h1>ПОГИБ</h1>
      <div class="result" id="gameover-result"></div><button id="restart-btn">Больно...</button>
    </div>
    <div id="victory" class="overlay">
      <h1>ПОБЕДА!</h1>
      <div class="result" id="victory-result"></div><button id="next-btn">Забрать добычу</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const BATTLE_API_URL = "https://jesterapi.ddns.net";
    const initData = tg.initData || "";
    let battle = null, tg_data = {}, apiReady = false, battleSeed = 0, logFlushInFlight = false;

    function parseBattleData(data) {
      if (data == null) return {};
      if (typeof data === "object") return data;
      try { return JSON.parse(data); } catch (_) { return {}; }
    }
    async function apiRequest(path, options = {}) {
      if (!initData) throw new Error("Telegram initData is unavailable");
      const response = await fetch(`${BATTLE_API_URL}${path}`, { ...options, headers: { "Content-Type": "application/json", "X-Init-Data": initData, ...(options.headers || {}) } });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(payload.detail || `HTTP ${response.status}`);
      return payload;
    }
    async function loadBattle() {
      try {
        const payload = await apiRequest("/battle"); battle = payload.battle;
        if (!battle) { document.getElementById("battle-start").classList.remove("show"); document.getElementById("no-battle").classList.add("show"); return false; }
        tg_data = parseBattleData(battle.data);
        if (!Number.isFinite(Number(tg_data.monster_hp)) || Number(tg_data.monster_hp) <= 0) throw new Error("Invalid battle data");
        tg_data.money_drop = tg_data.money_drop ?? 0;
        tg_data.items_drop = Array.isArray(tg_data.items_drop) ? tg_data.items_drop : [];
        document.getElementById("enemy-label").innerText = tg_data.monster_name || "Противник";
        if (tg_data.monster_id != null) document.getElementById("slider-monster").src = `assets/${tg_data.monster_id}.png`;
        battleSeed = Number(payload.battle.seed || 0) >>> 0;
        apiReady = true; return true;
      } catch (error) {
        console.error("[battle] load failed", error);
        document.getElementById("battle-start").classList.remove("show"); document.getElementById("no-battle").classList.add("show");
        document.querySelector("#no-battle .result").innerHTML = "НЕ УДАЛОСЬ ЗАГРУЗИТЬ БИТВУ<br>ПОПРОБУЙТЕ ОТКРЫТЬ ИГРУ ЕЩЁ РАЗ"; return false;
      }
    }
  </script>

  <script>
    const state = {
      playerHearts: 3, enemyHP: tg_data.monster_hp, enemyMaxHP: tg_data.monster_hp,
      currentCue: null, isGameOver: false, isVictory: false,
      difficulty: 1, combo: 0, bestCombo: 0, swipeStart: null, swipeRay: -1, startTimer: null,
      audio: null, lastCueTarget: -1,
      slider: { zones: [], position: .5, active: false, roundStart: 0, rafId: null, drag: false },
      log: [], logSent: 0, sessionStartedAt: 0, finished: false, nextSeq: 1, roundIndex: 0
    };
    const STAR_ANGLES = [-90, -18, 54, 126, 198];
    const CX = 100, CY = 100, R_TIP = 97, R_MID = 40, RAY_W = 6.5;
    const TIMING = { warmup: 620, perfect: 360, fadeOut: 430, trapIn: 610, trapHold: 720 };
    const COL = { warmStart: [82, 45, 15], warmEnd: [255, 160, 35], perfect: [75, 255, 140], fadeStart: [255, 184, 72], fadeEnd: [110, 82, 30], trap: [255, 55, 70] };
    const battleStartOverlay = document.getElementById("battle-start"), startBattleBtn = document.getElementById("start-battle-btn"), gameEl = document.getElementById("game"), enemyHPFill = document.getElementById("enemy-hp-fill"), heartsSection = document.getElementById("hearts-section"), notificationEl = document.getElementById("notification"), flashOverlay = document.getElementById("flash-overlay"), starSVG = document.getElementById("star-svg"), starContainer = document.getElementById("star-container"), centerBtn = document.getElementById("center-btn"),
      gameOverOverlay = document.getElementById("game-over"), victoryOverlay = document.getElementById("victory"), enemyOrb = document.getElementById("enemy-orb"), comboValue = document.getElementById("combo-value"), gameoverResult = document.getElementById("gameover-result"), victoryResult = document.getElementById("victory-result");
    const sliderGame = document.getElementById("slider-game"), sliderTrack = document.getElementById("slider-track"), sliderTimerFill = document.getElementById("slider-timer-fill"), sliderStatus = document.getElementById("slider-status"), sliderKnob = document.getElementById("slider-knob"), sliderMonster = document.getElementById("slider-monster");;
    const SVG_NS = "http://www.w3.org/2000/svg";

    // Переключение режима игры:
    // "star"   — исходная мини-игра со звездой.
    // "slider" — полоска с бегунком и несколькими зонами.
    const GAME_MODE = "slider";

    const SLIDER_CONFIG = {
      roundTime: 2600,          // время на все зоны одной волны, мс
      minZones: 2,
      maxZones: 4,
      minZoneWidth: .13,        // ширина желтой зоны
      maxZoneWidth: .19,
      greenRatio: .20,          // зеленая часть внутри каждой обычной зоны
      damageYellow: 7,
      damageGreen: 24,
      damageMiss: 1,
      damageCritical: 45,
      criticalZoneWidthMin: .035,
      criticalZoneWidthMax: .035,

      else { centerBtn.classList.add("cue-active"); Object.entries(props).forEach(([k, v]) => centerBtn.style.setProperty(k, v)) }
    }
    function clearCueVisuals() {
      rayBaseEls.forEach(el => { el.classList.remove("cue-active"); el.removeAttribute("style") });
      rayTipEls.forEach(el => el.removeAttribute("style"));
      centerBtn.classList.remove("cue-active"); centerBtn.removeAttribute("style");
    }
    function endCue() {
      if (state.currentCue?.rafId) cancelAnimationFrame(state.currentCue.rafId);
      clearCueVisuals(); state.currentCue = null;
      setTimeout(() => { if (!state.isGameOver && !state.isVictory) spawnCue() }, 90);
    }

    function handleInput(targetIndex) {
      initAudio(); state.audio?.resume();
      const cue = state.currentCue; if (!cue || cue.resolved || state.isGameOver || state.isVictory) return;
      if (cue.isFeint) {
        cue.resolved = true; state.combo = 0; updateCombo(); showNotification("DAMAGED!", "#ff3344"); damagePlayer(); hitSound(false); endCue(); return;
      }
      if (cue.target !== targetIndex) return;
      cue.resolved = true;
      if (cue.phase === "WARMUP") {
        state.combo = 0; updateCombo(); showNotification("EARLY!", "#ffa040"); damageEnemy(5); hitSound(false);
      } else if (cue.phase === "PERFECT") {
        state.combo++; state.bestCombo = Math.max(state.bestCombo, state.combo); updateCombo();
        const amount = Math.min(50, 25 + Math.max(0, state.combo - 1) * 3);
        showNotification(state.combo >= 3 ? `PERFECT ×${state.combo}` : "PERFECT!", "#44ff88");
        damageEnemy(amount); flashScreen(); hitSound(true);
      } else if (cue.phase === "FADEOUT") {
        state.combo = 0; updateCombo(); showNotification("GOOD!", "#d7c46c"); damageEnemy(10); hitSound(false);
      }
      endCue();
    }
    function handleMiss() { state.combo = 0; updateCombo(); showNotification("ПРОМАХ!", "#ff3344"); damagePlayer(); hitSound(false) }
    function damageEnemy(amount) { state.enemyHP = Math.max(0, state.enemyHP - amount); updateEnemyHPDisplay(); enemyOrb.parentElement.classList.remove("hit"); void enemyOrb.parentElement.offsetWidth; enemyOrb.parentElement.classList.add("hit"); if (state.enemyHP <= 0) victory() }
    function damagePlayer() { state.playerHearts--; gameLog("damage", { extra: { hearts: state.playerHearts } }); const heart = heartsSection.querySelector(`[data-heart="${state.playerHearts}"]`); if (heart) { heart.classList.add("breaking"); setTimeout(() => heart.classList.remove("breaking"), 400) } updateHeartsDisplay(); shakeScreen(); if (state.playerHearts <= 0) gameOver() }
    function victory() {
      state.isVictory = true; finishBattle("victory"); state.slider.active = false; if (state.currentCue?.rafId) cancelAnimationFrame(state.currentCue.rafId); if (state.slider.rafId) cancelAnimationFrame(state.slider.rafId); clearCueVisuals();

      victoryResult.innerHTML = `<h2><b>+💰${tg_data.money_drop}</b></h2> ${tg_data.items_drop.join('<br>') + '<br>'}`;

      setTimeout(() => victoryOverlay.classList.add("show"), 450)
    }

    function gameOver() {
      state.isGameOver = true; finishBattle("death"); state.slider.active = false; if (state.currentCue?.rafId) cancelAnimationFrame(state.currentCue.rafId); if (state.slider.rafId) cancelAnimationFrame(state.slider.rafId); clearCueVisuals();
      gameoverResult.innerHTML = `ПОДРАНОК СБЕЖАЛ`; setTimeout(() => gameOverOverlay.classList.add("show"), 450)
    }
    function updateHeartsDisplay() { heartsSection.querySelectorAll(".heart").forEach((h, i) => h.classList.toggle("lost", i >= state.playerHearts)) }
    function updateEnemyHPDisplay() { enemyHPFill.style.width = (state.enemyHP / state.enemyMaxHP * 100) + "%" }
    function updateCombo() { comboValue.textContent = "×" + state.combo }
    function showNotification(text, color) { notificationEl.textContent = text; notificationEl.style.color = color; notificationEl.classList.remove("show"); void notificationEl.offsetWidth; notificationEl.classList.add("show") }
    function flashScreen() { flashOverlay.classList.remove("flash"); void flashOverlay.offsetWidth; flashOverlay.classList.add("flash") }
    function shakeScreen() { gameEl.classList.remove("shake"); void gameEl.offsetWidth; gameEl.classList.add("shake") }

    function updateSwipeHighlight(x, y) {
      const rect = starContainer.getBoundingClientRect();
      if (rect.width === 0 || rect.height === 0) return;
      const cxS = rect.left + rect.width / 2, cyS = rect.top + rect.height / 2, scale = rect.width / 200, px = (x - cxS) / scale, py = (y - cyS) / scale;
      if (state.swipeStart) {
        const dx = x - state.swipeStart.x, dy = y - state.swipeStart.y;
        if (Math.hypot(dx, dy) > 14) {
          const rayIdx = matchRay(dx, dy);
          if (rayIdx >= 0) {
            state.swipeRay = rayIdx; const a = STAR_ANGLES[rayIdx] * Math.PI / 180, proj = (px - CX) * Math.cos(a) + (py - CY) * Math.sin(a), progress = Math.max(0, Math.min(1, proj / R_TIP));
            swipeRects[rayIdx].setAttribute("width", progress * (R_TIP + 5)); rayHlEls[rayIdx].classList.add("hl-on"); return;
          }
        }
      }
      hideSwipeHighlight(0);
    }
    function hideSwipeHighlight(delay = 80) { const idx = state.swipeRay; if (idx >= 0) { setTimeout(() => { rayHlEls[idx]?.classList.remove("hl-on"); swipeRects[idx]?.setAttribute("width", 0) }, delay); state.swipeRay = -1 } }
    function slashFlash(i) { if (i < 0 || i > 4) return; swipeRects[i].setAttribute("width", R_TIP + 5); rayHlEls[i].classList.add("hl-on"); setTimeout(() => { rayHlEls[i].classList.remove("hl-on"); swipeRects[i].setAttribute("width", 0) }, 150) }
    function matchRay(dx, dy) {
      const angle = Math.atan2(dy, dx) * 180 / Math.PI; let closest = -1, minDiff = 999;
      STAR_ANGLES.forEach((sa, i) => { let diff = Math.abs(((angle - sa + 540) % 360) - 180); if (diff < minDiff) { minDiff = diff; closest = i } });
      const a = STAR_ANGLES[closest] * Math.PI / 180, outward = dx * Math.cos(a) + dy * Math.sin(a) > 0;
      return minDiff <= 35 && outward ? closest : -1;
    }
    function processInput(endX, endY) {
      if (!state.swipeStart) return;
      const rect = starContainer.getBoundingClientRect();
      if (rect.width === 0 || rect.height === 0) return;
      const dx = endX - state.swipeStart.x, dy = endY - state.swipeStart.y, dist = Math.hypot(dx, dy), cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2, distToCenter = Math.hypot(endX - cx, endY - cy);
      if (dist < 25 && distToCenter < rect.width * .18) { centerBtn.classList.remove("tap-ping"); void centerBtn.offsetWidth; centerBtn.classList.add("tap-ping"); hideSwipeHighlight(0); handleInput(5); return }
      const rayIdx = dist >= 30 ? matchRay(dx, dy) : -1;
      if (rayIdx >= 0) { slashFlash(rayIdx); handleInput(rayIdx) } else hideSwipeHighlight()
    }
    function setupEventListeners() {
      const zone = document.getElementById("input-zone");
      zone.addEventListener("touchstart", e => {
        if (GAME_MODE !== "star") return;
        e.preventDefault();
        e.stopPropagation();
        initAudio();
        const t = e.touches[0];
        state.swipeStart = { x: t.clientX, y: t.clientY }
      }, { passive: false });

      zone.addEventListener("touchmove", e => {
        if (GAME_MODE !== "star") return;
        e.preventDefault();
        e.stopPropagation();
        const t = e.touches[0];
        updateSwipeHighlight(t.clientX, t.clientY)
      }, { passive: false });

      zone.addEventListener("touchend", e => {
        if (GAME_MODE !== "star") return;
        e.preventDefault();
        e.stopPropagation();
        const t = e.changedTouches[0];
        processInput(t.clientX, t.clientY);
        state.swipeStart = null
      }, { passive: false });

      zone.addEventListener("touchcancel", () => {
        if (GAME_MODE !== "star") return;
        hideSwipeHighlight(0); state.swipeStart = null
      });
      zone.addEventListener("mousedown", e => {
        if (GAME_MODE === "star") state.swipeStart = { x: e.clientX, y: e.clientY }
      });
      zone.addEventListener("mousemove", e => {
        if (GAME_MODE === "star" && state.swipeStart) updateSwipeHighlight(e.clientX, e.clientY)
      });
      zone.addEventListener("mouseup", e => {
        if (GAME_MODE === "star") {
          processInput(e.clientX, e.clientY); state.swipeStart = null
        }
      });

      // Slider mode: the runner moves automatically.
      // The player only taps/clicks to attempt a hit.
      zone.addEventListener("pointerdown", e => {
        if (GAME_MODE !== "slider") return;
        e.preventDefault();
        resolveSliderHit();
      });

      document.addEventListener("keydown", e => {
        if (e.code !== "Space" || GAME_MODE !== "slider") return;

        const battleStarted = !battleStartOverlay.classList.contains("show");
        if (!battleStarted) return;

        e.preventDefault();
        e.stopPropagation();
        if (e.repeat || !state.slider.active) return;

        resolveSliderHit();
      }, { passive: false });

      document.addEventListener("keyup", e => {
        if (e.code !== "Space" || GAME_MODE !== "slider") return;
        if (!battleStartOverlay.classList.contains("show")) {
          e.preventDefault();
          e.stopPropagation();
        }
      }, { passive: false });

      startBattleBtn.addEventListener("click", beginBattle);

      document.getElementById("restart-btn").addEventListener("click", () => {
        const dataToSend = JSON.stringify({
          action: "hunt",
          message: "victory"
        });

        tg.sendData(dataToSend);
      });

      document.getElementById("next-btn").addEventListener("click", () => {
        const dataToSend = JSON.stringify({
          action: "hunt",
          message: "victory"
        });

        tg.sendData(dataToSend);
      });
    }

    drawStar(); setupEventListeners();
    (async () => { const loaded = await loadBattle(); if (loaded) startGame(); })();
  </script>
</body>
